name: Check the shops

# Runs Thermohub's shop checks (python -m thermohub.diagnose) in the built
# image against the real Woolworths and Coles websites. GitHub's servers
# aren't a home connection, so the shops' bot protection may treat them
# differently, but the shape of their data is the same.
on:
  workflow_dispatch:
  push:
    branches: [claude/sweet-fermat-fhxd43]
    paths:
      - thermohub/diagnose.py
      - thermohub/stores/**
      - thermohub/browser.py
      - .github/workflows/check-shops.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: thermohub:check
          cache-from: type=gha
      - name: Check Woolworths and Coles
        run: |
          mkdir -m 777 shots
          docker run --rm -v "$PWD/shots:/shots" thermohub:check \
            python -m thermohub.diagnose --deep --terms milk bananas "toilet paper" --shots /shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shop-screenshots
          path: shots
          retention-days: 7
