<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thermohub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232d5fd3'/%3E%3Cpath d='M9 12h14l-1.6 9.2a2 2 0 0 1-2 1.8h-6.8a2 2 0 0 1-2-1.8z' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f3;
    --surface: #ffffff;
    --surface-2: #f8f9f7;
    --text: #1c211e;
    --muted: #68716b;
    --faint: #9aa29c;
    --border: #e2e5e1;
    --accent: #2d5fd3;
    --accent-soft: #e9effc;
    --accent-text: #ffffff;
    --good: #1d8a4c;
    --good-soft: #e6f4ec;
    --bad: #c53a2e;
    --bad-soft: #fcebe9;
    --woolworths: #178841;
    --coles: #e01a22;
    --cookidoo: #0f8a8a;
    --shadow: 0 1px 2px rgb(20 30 25 / 6%), 0 1px 1px rgb(20 30 25 / 4%);
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121513;
      --surface: #1a1e1b;
      --surface-2: #202521;
      --text: #e7ebe8;
      --muted: #9ba49e;
      --faint: #6c756f;
      --border: #2b322d;
      --accent: #7ea2f5;
      --accent-soft: #1f2a44;
      --accent-text: #0e1424;
      --good: #5cc48a;
      --good-soft: #17301f;
      --bad: #f08a7e;
      --bad-soft: #3a1d1a;
      --woolworths: #4cc27a;
      --coles: #ff6b6f;
      --cookidoo: #3cc2c2;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  button, select, input { font: inherit; color: inherit; }
  a { color: inherit; }
  [hidden] { display: none !important; }

  .app { max-width: 1240px; margin: 0 auto; padding: 16px 16px 96px; }

  /* Top bar */
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .brand { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; }
  .ghost {
    border: 1px solid var(--border); background: var(--surface); border-radius: 8px;
    padding: 6px 12px; font-size: 0.875rem; cursor: pointer;
  }
  .ghost:hover { border-color: var(--faint); }
  .ghost:disabled { opacity: 0.6; cursor: default; }

  /* Connections */
  .connections { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  .conn {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 12px 14px; min-width: 0;
  }
  .conn-name { display: flex; align-items: center; gap: 8px; font-weight: 650; margin-bottom: 6px; }
  .mark { width: 10px; height: 10px; border-radius: 3px; flex: none; background: var(--brand, var(--muted)); }
  .lines { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .line { display: flex; align-items: center; gap: 8px; font-size: 0.875rem; }
  .line .label { color: var(--muted); min-width: 58px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--faint); }
  .line.ok .dot { background: var(--good); }
  .line.bad .dot { background: var(--bad); }
  .line.off .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--faint); }
  .line.wait .dot { animation: pulse 1s ease-in-out infinite alternate; }
  .line.bad .value { color: var(--bad); }
  @keyframes pulse { from { opacity: 0.25; } to { opacity: 1; } }
  .conn-detail {
    margin: 6px 0 0; font-size: 0.8rem; color: var(--muted);
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow-wrap: anywhere;
  }
  .conn-detail.bad { color: var(--bad); }

  /* API key */
  .keycard {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 16px;
  }
  .keycard label { flex: 1 0 100%; font-weight: 600; }
  .keycard input {
    flex: 1 1 220px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg);
  }

  /* Workspace */
  .workspace { display: grid; grid-template-columns: minmax(320px, 400px) minmax(0, 1fr); gap: 16px; align-items: start; }
  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); min-width: 0;
  }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 14px 16px 10px; }
  h2 { margin: 0; font-size: 1rem; }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: 0.85rem; }
  .linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font-size: 0.85rem; cursor: pointer; }
  .linkbtn:disabled { color: var(--faint); cursor: default; }
  .tools { display: flex; gap: 14px; flex: none; }

  .owned-toggle {
    display: flex; align-items: center; gap: 8px; padding: 0 16px 10px;
    color: var(--muted); font-size: 0.85rem; cursor: pointer;
  }

  /* Shopping list */
  .items { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border); }
  .item { border-bottom: 1px solid var(--border); }
  .item:last-child { border-bottom: 0; }
  .item label { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; padding: 10px 16px; cursor: pointer; align-items: start; }
  .item label:hover { background: var(--surface-2); }
  .item.selected label { background: var(--accent-soft); }
  .item input { width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--accent); }
  .item .name { font-weight: 600; overflow-wrap: anywhere; }
  .item .qty { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .item .from { grid-column: 2 / 4; color: var(--muted); font-size: 0.8rem; margin-top: -2px; }
  .item.owned .name { text-decoration: line-through; color: var(--muted); }
  .pill {
    display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 4px;
    background: var(--surface-2); border: 1px solid var(--border);
    color: var(--muted); font-size: 0.72rem; font-weight: 500; vertical-align: 1px;
  }

  .compare-bar {
    position: sticky; bottom: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 16px; border-top: 1px solid var(--border); background: var(--surface);
    border-radius: 0 0 var(--radius) var(--radius);
  }
  .compare-bar span { color: var(--muted); font-size: 0.875rem; }
  .primary {
    border: 0; border-radius: 8px; padding: 9px 16px; font-weight: 650;
    background: var(--accent); color: var(--accent-text); cursor: pointer;
  }
  .primary:disabled { opacity: 0.45; cursor: default; }

  .notice { margin: 0; padding: 16px; color: var(--muted); font-size: 0.9rem; }
  .notice.bad { color: var(--bad); }
  .skeleton { padding: 4px 16px 16px; }
  .skeleton div { height: 14px; border-radius: 6px; background: var(--surface-2); margin: 14px 0; animation: pulse 1s ease-in-out infinite alternate; }

  /* Comparison */
  .compare-panel { position: sticky; top: 16px; }
  .compare-scroll { max-height: calc(100vh - 90px); overflow: auto; }
  .empty { padding: 32px 24px 40px; text-align: center; color: var(--muted); }
  .empty strong { display: block; color: var(--text); font-size: 1rem; margin-bottom: 4px; }

  .verdict { margin: 0 16px; padding: 14px 16px; border-radius: 10px; background: var(--surface-2); }
  .verdict.win { background: var(--good-soft); }
  .verdict h3 { margin: 0; font-size: 1.2rem; letter-spacing: -0.01em; }
  .verdict p { margin: 4px 0 0; color: var(--muted); font-size: 0.875rem; }
  .verdict.win h3 { color: var(--good); }

  .totals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 12px 16px; }
  .total { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; min-width: 0; }
  .total .k { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 0.8rem; }
  .total .v { font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .total .s { color: var(--muted); font-size: 0.75rem; }
  .total.best { border-color: var(--good); box-shadow: inset 0 0 0 1px var(--good); }
  .store-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); flex: none; }

  .alerts { margin: 0 16px 8px; padding: 0; list-style: none; display: grid; gap: 6px; }
  .alerts li { font-size: 0.85rem; padding: 8px 12px; border-radius: 8px; background: var(--surface-2); color: var(--muted); }
  .alerts li.bad { background: var(--bad-soft); color: var(--bad); }

  .cmp { border-top: 1px solid var(--border); }
  .cmp-head, .cmp-row { display: grid; grid-template-columns: minmax(120px, 0.8fr) minmax(0, 1fr) minmax(0, 1fr); gap: 10px; padding: 10px 16px; }
  .cmp-head { position: sticky; top: 0; background: var(--surface); z-index: 1; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 0.8rem; font-weight: 600; padding-top: 8px; padding-bottom: 8px; }
  .cmp-head span { display: flex; align-items: center; gap: 6px; }
  .cmp-row { border-bottom: 1px solid var(--border); align-items: start; }
  .cmp-row:last-child { border-bottom: 0; }
  .cmp-item { font-weight: 600; overflow-wrap: anywhere; padding-top: 6px; }
  .cmp-item .term { display: block; font-weight: 400; color: var(--muted); font-size: 0.75rem; }

  .cell { border: 1px solid var(--border); border-radius: 10px; padding: 8px; min-width: 0; display: grid; gap: 6px; }
  .cell.cheaper { border-color: var(--good); background: var(--good-soft); }
  .cell.none { border-style: dashed; color: var(--muted); font-size: 0.85rem; place-content: center; min-height: 64px; text-align: center; }
  .cell.none.bad { color: var(--bad); border-color: var(--bad); }
  .product { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 8px; align-items: start; }
  .product img, .product .noimg { width: 40px; height: 40px; border-radius: 6px; object-fit: contain; background: #fff; }
  .product .noimg { background: var(--surface-2); }
  .pname { font-size: 0.85rem; font-weight: 600; text-decoration: none; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .pname:hover { text-decoration: underline; }
  .pmeta { font-size: 0.75rem; color: var(--muted); }
  .pprice { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pprice .was { display: block; font-weight: 400; font-size: 0.72rem; color: var(--muted); text-decoration: line-through; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 0.7rem; font-weight: 650; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); color: var(--muted); }
  .tag.good { background: var(--good); color: #fff; }
  .tag.special { background: var(--bad-soft); color: var(--bad); }
  .cell select {
    width: 100%; font-size: 0.78rem; padding: 4px 6px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--surface); color: var(--muted);
  }
  .footnote { margin: 0; padding: 12px 16px 16px; color: var(--muted); font-size: 0.78rem; }

  /* Small screens */
  @media (max-width: 900px) {
    .workspace { grid-template-columns: minmax(0, 1fr); }
    .compare-panel { position: static; }
    .compare-scroll { max-height: none; overflow: visible; }
    .compare-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; border-radius: 0;
      box-shadow: 0 -4px 16px rgb(0 0 0 / 8%); padding-bottom: max(12px, env(safe-area-inset-bottom));
    }
  }
  @media (max-width: 700px) {
    .connections { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px 16px; padding: 0 16px 4px; }
    .conn { flex: 0 0 76%; scroll-snap-align: start; }
    .totals { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .total.split { grid-column: 1 / -1; }
    .cmp-head { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cmp-head span:first-child { display: none; }
    .cmp-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cmp-item { grid-column: 1 / -1; padding-top: 0; }
    .product { grid-template-columns: minmax(0, 1fr) auto; }
    .product img, .product .noimg { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">Thermohub</div>
    <button id="refresh" class="ghost" type="button">Refresh</button>
  </header>

  <section class="connections" id="connections" aria-label="Connections"></section>

  <form id="key-form" class="keycard" hidden>
    <label for="key-input">Enter this Thermohub's API key</label>
    <input id="key-input" type="password" autocomplete="current-password" placeholder="API key">
    <button class="primary" type="submit">Continue</button>
  </form>

  <main class="workspace">
    <section class="panel list-panel" aria-labelledby="list-title">
      <div class="panel-head">
        <div>
          <h2 id="list-title">Shopping list</h2>
          <p class="sub" id="list-sub">Loading…</p>
        </div>
        <div class="tools">
          <button class="linkbtn" id="select-all" type="button">Select all</button>
          <button class="linkbtn" id="select-none" type="button">Clear</button>
        </div>
      </div>
      <label class="owned-toggle"><input type="checkbox" id="include-owned"> Include items ticked off in Cookidoo</label>
      <div id="list-body"><div class="skeleton"><div></div><div></div><div></div></div></div>
      <div class="compare-bar">
        <span id="selected-count">Select items to compare</span>
        <button id="compare" class="primary" type="button" disabled>Compare prices</button>
      </div>
    </section>

    <section class="panel compare-panel" id="compare-panel" aria-labelledby="compare-title">
      <div class="compare-scroll">
        <div class="panel-head"><h2 id="compare-title">Woolworths vs Coles</h2></div>
        <div id="compare-body">
          <div class="empty">
            <strong>Which store is cheaper?</strong>
            Tick items on your shopping list, then press Compare prices.
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
  const STORES = [
    { id: "woolworths", name: "Woolworths" },
    { id: "coles", name: "Coles" },
  ];
  const KEY_STORAGE = "thermohub-api-key";
  const money = new Intl.NumberFormat("en-AU", { style: "currency", currency: "AUD" });

  const state = {
    list: null,
    selected: new Set(),
    comparison: null,
    picks: [],        // per comparison item: { storeId: candidate index }
    comparing: false,
  };
  let apiKey = readKey();

  const $ = (id) => document.getElementById(id);

  function el(tag, props = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props)) {
      if (key === "class") node.className = value;
      else if (key === "style") node.style.cssText = value;
      else if (key.startsWith("data-") || key.startsWith("aria-")) node.setAttribute(key, value);
      else node[key] = value;
    }
    node.append(...children.flat().filter((c) => c !== null && c !== undefined && c !== false));
    return node;
  }

  function readKey() {
    try { return localStorage.getItem(KEY_STORAGE) || ""; } catch { return ""; }
  }

  function saveKey(key) {
    apiKey = key;
    try { localStorage.setItem(KEY_STORAGE, key); } catch { /* private browsing: key lasts this visit */ }
  }

  function safeUrl(value) {
    return typeof value === "string" && /^https?:\/\//.test(value) ? value : null;
  }

  class NeedsKey extends Error {}

  async function api(path, options = {}) {
    const headers = { ...(options.body ? { "Content-Type": "application/json" } : {}) };
    if (apiKey) headers["X-API-Key"] = apiKey;
    let res;
    try {
      res = await fetch(`api/${path}`, { ...options, headers });
    } catch {
      throw new Error("Can't reach Thermohub");
    }
    if (res.status === 401) throw new NeedsKey();
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(typeof body.detail === "string" ? body.detail : `Request failed (${res.status})`);
    return body;
  }

  function askForKey() {
    $("key-form").hidden = false;
    $("key-input").focus();
  }

  // ---- Connections ----------------------------------------------------

  function renderConnections(status, error) {
    const wait = { state: "wait", value: "Checking…" };
    const cards = [];

    const cookidoo = status
      ? status.cookidoo.ok
        ? { state: "ok", value: "Connected", detail: status.cookidoo.detail }
        : { state: "bad", value: "Not connected", detail: status.cookidoo.detail }
      : error ? { state: "bad", value: "Unknown", detail: error } : wait;
    cards.push(card("Cookidoo", "var(--cookidoo)", [line("Account", cookidoo)], cookidoo.detail, cookidoo.state === "bad"));

    for (const store of STORES) {
      const s = status && status.stores.find((x) => x.id === store.id);
      const prices = s
        ? s.prices.ok ? { state: "ok", value: "Working" } : { state: "bad", value: "Unavailable", detail: s.prices.detail }
        : error ? { state: "bad", value: "Unknown" } : wait;
      const account = s
        ? s.account.ok ? { state: "ok", value: "Connected" } : { state: "off", value: "Not connected", detail: s.account.detail }
        : error ? { state: "bad", value: "Unknown" } : wait;
      const detail = prices.detail || account.detail;
      cards.push(card(store.name, `var(--${store.id})`, [line("Prices", prices), line("Account", account)], detail, prices.state === "bad"));
    }
    $("connections").replaceChildren(...cards);
  }

  function card(name, color, lines, detail, isBad) {
    return el("article", { class: "conn" },
      el("div", { class: "conn-name" }, el("span", { class: "mark", style: `--brand: ${color}` }), name),
      el("ul", { class: "lines" }, lines),
      detail ? el("p", { class: `conn-detail${isBad ? " bad" : ""}`, title: detail }, detail) : null,
    );
  }

  function line(label, { state, value }) {
    return el("li", { class: `line ${state}` },
      el("span", { class: "dot" }), el("span", { class: "label" }, label), el("span", { class: "value" }, value));
  }

  async function loadStatus() {
    renderConnections(null, null);
    try {
      renderConnections(await api("status"), null);
    } catch (err) {
      if (err instanceof NeedsKey) return askForKey();
      renderConnections(null, err.message);
    }
  }

  // ---- Shopping list ---------------------------------------------------

  async function loadList() {
    $("list-sub").textContent = "Loading…";
    try {
      const includeOwned = $("include-owned").checked;
      state.list = await api(`shopping-list?include_owned=${includeOwned}`);
      const names = new Set(state.list.items.map((i) => i.name));
      state.selected = new Set([...state.selected].filter((n) => names.has(n)));
      renderList();
    } catch (err) {
      if (err instanceof NeedsKey) return askForKey();
      state.list = null;
      $("list-sub").textContent = "Couldn't load your list";
      $("list-body").replaceChildren(el("p", { class: "notice bad" }, err.message));
      renderSelection();
    }
  }

  function renderList() {
    const { items, recipes } = state.list;
    $("list-sub").textContent = `${items.length} ${items.length === 1 ? "item" : "items"} from ${recipes.length} ${recipes.length === 1 ? "recipe" : "recipes"}`;
    if (!items.length) {
      $("list-body").replaceChildren(el("p", { class: "notice" }, "Nothing to buy. Add recipes to your Cookidoo shopping list, then refresh."));
    } else {
      $("list-body").replaceChildren(el("ul", { class: "items" }, items.map(renderItem)));
    }
    renderSelection();
  }

  function renderItem(item) {
    const from = [...new Set(item.sources.map((s) => s.recipe_name || "Added to list"))].join(" · ");
    const checkbox = el("input", { type: "checkbox", checked: state.selected.has(item.name) });
    checkbox.addEventListener("change", () => {
      if (checkbox.checked) state.selected.add(item.name);
      else state.selected.delete(item.name);
      checkbox.closest(".item").classList.toggle("selected", checkbox.checked);
      renderSelection();
    });
    const classes = ["item", item.owned && "owned", state.selected.has(item.name) && "selected"].filter(Boolean).join(" ");
    return el("li", { class: classes },
      el("label", {},
        checkbox,
        el("span", { class: "name" }, item.name,
          item.optional ? el("span", { class: "pill" }, "optional") : null,
          item.owned ? el("span", { class: "pill" }, "ticked off") : null),
        el("span", { class: "qty" }, item.display),
        el("span", { class: "from" }, from),
      ));
  }

  function renderSelection() {
    const n = state.selected.size;
    const total = state.list ? state.list.items.length : 0;
    $("selected-count").textContent = n ? `${n} selected` : "Select items to compare";
    $("compare").disabled = n === 0 || state.comparing;
    $("compare").textContent = state.comparing ? "Comparing…" : "Compare prices";
    $("select-all").disabled = !total || n === total;
    $("select-none").disabled = n === 0;
  }

  function setAll(selected) {
    state.selected = new Set(selected && state.list ? state.list.items.map((i) => i.name) : []);
    if (state.list) renderList();
  }

  // ---- Comparison ------------------------------------------------------

  async function runComparison() {
    const names = state.list.items.map((i) => i.name).filter((n) => state.selected.has(n));
    state.comparing = true;
    renderSelection();
    $("compare-body").replaceChildren(
      el("p", { class: "notice" }, `Checking ${names.length} ${names.length === 1 ? "item" : "items"} at Woolworths and Coles…`),
      el("div", { class: "skeleton" }, el("div"), el("div"), el("div"), el("div")),
    );
    if (window.matchMedia("(max-width: 900px)").matches) $("compare-panel").scrollIntoView({ behavior: "smooth" });
    try {
      state.comparison = await api("compare", { method: "POST", body: JSON.stringify({ items: names }) });
      state.picks = state.comparison.items.map(() => ({}));
      renderComparison();
    } catch (err) {
      if (err instanceof NeedsKey) askForKey();
      $("compare-body").replaceChildren(el("p", { class: "notice bad" }, err.message || "Comparison failed"));
    } finally {
      state.comparing = false;
      renderSelection();
    }
  }

  function pick(i, storeId) {
    const match = state.comparison.items[i].matches[storeId];
    return match ? match.candidates[state.picks[i][storeId] || 0] || null : null;
  }

  function summarise() {
    const totals = Object.fromEntries(STORES.map((s) => [s.id, 0]));
    const found = Object.fromEntries(STORES.map((s) => [s.id, 0]));
    const missing = Object.fromEntries(STORES.map((s) => [s.id, []]));
    let split = 0;
    let compared = 0;
    state.comparison.items.forEach((item, i) => {
      const picks = STORES.map((s) => pick(i, s.id));
      STORES.forEach((s, j) => (picks[j] ? found[s.id]++ : missing[s.id].push(item.name)));
      if (picks.every(Boolean)) {
        compared++;
        split += Math.min(...picks.map((p) => p.price));
        STORES.forEach((s, j) => (totals[s.id] += picks[j].price));
      }
    });
    return { totals, found, missing, split, compared };
  }

  function cheaperStore(i) {
    const picks = STORES.map((s) => pick(i, s.id));
    if (!picks.every(Boolean) || Math.abs(picks[0].price - picks[1].price) < 0.005) return null;
    return picks[0].price < picks[1].price ? STORES[0].id : STORES[1].id;
  }

  function renderComparison() {
    const c = state.comparison;
    const sum = summarise();
    const [a, b] = STORES;
    const nameOf = (id) => STORES.find((s) => s.id === id).name;
    const count = (n) => `${n} ${n === 1 ? "item" : "items"}`;

    // Verdict
    const errors = Object.fromEntries(STORES.map((s) => [s.id,
      [...new Set(c.items.map((item) => item.matches[s.id] && item.matches[s.id].error).filter(Boolean))]]));
    const failed = STORES.filter((s) => errors[s.id].length);
    let verdict;
    const diff = Math.abs(sum.totals[a.id] - sum.totals[b.id]);
    if (!sum.compared && failed.length) {
      verdict = el("div", { class: "verdict" },
        el("h3", {}, `Couldn't get ${failed.map((s) => s.name).join(" or ")} prices`),
        el("p", {}, "The reason is below. Results from the other store are still shown."));
    } else if (!sum.compared) {
      verdict = el("div", { class: "verdict" }, el("h3", {}, "Nothing to compare"),
        el("p", {}, "No item was found at both stores. Try a different product name in Cookidoo."));
    } else if (diff < 0.005) {
      verdict = el("div", { class: "verdict" }, el("h3", {}, "Same price at both"),
        el("p", {}, `${money.format(sum.totals[a.id])} for the ${count(sum.compared)} both stores have.`));
    } else {
      const winner = sum.totals[a.id] < sum.totals[b.id] ? a : b;
      const cheapest = Math.min(sum.totals[a.id], sum.totals[b.id]);
      const extra = cheapest - sum.split;
      verdict = el("div", { class: "verdict win" },
        el("h3", {}, `${winner.name} is ${money.format(diff)} cheaper`),
        el("p", {}, `For the ${count(sum.compared)} both stores have.` +
          (extra >= 0.01 ? ` Splitting the shop would save another ${money.format(extra)}.` : "")));
    }

    // Totals
    const best = sum.compared ? STORES.reduce((x, y) => (sum.totals[y.id] < sum.totals[x.id] ? y : x)) : null;
    const totals = el("div", { class: "totals" },
      STORES.map((s) => el("div", { class: `total${best && diff >= 0.005 && best.id === s.id ? " best" : ""}` },
        el("div", { class: "k" }, el("span", { class: "store-dot", style: `--brand: var(--${s.id})` }), s.name),
        el("div", { class: "v" }, money.format(sum.totals[s.id])),
        el("div", { class: "s" }, `Has ${sum.found[s.id]} of ${c.items.length}`))),
      el("div", { class: "total split" },
        el("div", { class: "k" }, "Split the shop"),
        el("div", { class: "v" }, money.format(sum.split)),
        el("div", { class: "s" }, "Each item where it's cheaper")),
    );

    // Store problems and missing items
    const alerts = [];
    for (const s of STORES) {
      if (errors[s.id].length) alerts.push(el("li", { class: "bad" }, `${s.name}: ${errors[s.id][0]}`));
      else if (sum.missing[s.id].length) alerts.push(el("li", {}, `Not found at ${s.name}: ${sum.missing[s.id].join(", ")}`));
    }

    // Rows
    const head = el("div", { class: "cmp-head" }, el("span", {}, "Item"),
      STORES.map((s) => el("span", {}, el("span", { class: "store-dot", style: `--brand: var(--${s.id})` }), s.name)));
    const rows = c.items.map((item, i) => {
      const cheaper = cheaperStore(i);
      const term = Object.values(item.matches)[0]?.search_term;
      return el("div", { class: "cmp-row" },
        el("div", { class: "cmp-item" }, item.name,
          term && term.toLowerCase() !== item.name.toLowerCase() ? el("span", { class: "term" }, `searched “${term}”`) : null),
        STORES.map((s) => renderCell(i, s, cheaper === s.id)));
    });

    $("compare-body").replaceChildren(...[
      verdict,
      sum.compared ? totals : null,
      alerts.length ? el("ul", { class: "alerts" }, alerts) : null,
      el("div", { class: "cmp" }, head, rows),
      el("p", { class: "footnote" }, "Totals count one of each product shown, at each store's online price. If a match is wrong, pick another product from its list and the totals update."),
    ].filter(Boolean));
  }

  function renderCell(i, store, isCheaper) {
    const match = state.comparison.items[i].matches[store.id];
    if (!match || !match.candidates.length) {
      const error = match && match.error;
      return el("div", { class: `cell none${error ? " bad" : ""}`, title: error || "" }, error ? "Couldn't search" : "Not found");
    }
    const p = pick(i, store.id);
    const url = safeUrl(p.url);
    const image = safeUrl(p.image);
    const meta = [p.size, p.unit_price && p.unit_price.text].filter(Boolean).join(" · ");
    const name = url ? el("a", { class: "pname", href: url, target: "_blank", rel: "noopener" }, p.name) : el("span", { class: "pname" }, p.name);

    const tags = [];
    if (isCheaper) tags.push(el("span", { class: "tag good" }, "Cheaper"));
    if (p.on_special) tags.push(el("span", { class: "tag special" }, "Special"));

    let chooser = null;
    if (match.candidates.length > 1) {
      chooser = el("select", { "aria-label": `Choose a different ${store.name} product for ${state.comparison.items[i].name}` });
      match.candidates.forEach((cand, j) => {
        const label = `${cand.name}${cand.size && !cand.name.includes(cand.size) ? ` ${cand.size}` : ""} — ${money.format(cand.price)}`;
        chooser.append(el("option", { value: String(j), selected: j === (state.picks[i][store.id] || 0) }, label));
      });
      chooser.addEventListener("change", () => {
        state.picks[i][store.id] = Number(chooser.value);
        renderComparison();
      });
    }

    return el("div", { class: `cell${isCheaper ? " cheaper" : ""}` },
      el("div", { class: "product" },
        image ? el("img", { src: image, alt: "", loading: "lazy" }) : el("span", { class: "noimg" }),
        el("div", {}, name, meta ? el("div", { class: "pmeta" }, meta) : null),
        el("div", { class: "pprice" }, money.format(p.price), p.was_price ? el("span", { class: "was" }, money.format(p.was_price)) : null)),
      tags.length ? el("div", { class: "tags" }, tags) : null,
      chooser);
  }

  // ---- Wiring ----------------------------------------------------------

  function refresh() {
    loadStatus();
    loadList();
  }

  $("refresh").addEventListener("click", refresh);
  $("include-owned").addEventListener("change", loadList);
  $("select-all").addEventListener("click", () => setAll(true));
  $("select-none").addEventListener("click", () => setAll(false));
  $("compare").addEventListener("click", runComparison);
  $("key-form").addEventListener("submit", (event) => {
    event.preventDefault();
    saveKey($("key-input").value.trim());
    $("key-form").hidden = true;
    refresh();
  });

  refresh();
</script>
</body>
</html>
